<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Tolerate: The Deep Drop</title>
    <meta name="description" content="A daily number-estimation game where you set a mattress range over a canyon to catch the jumper." />
    <meta property="og:title" content="Tolerate: The Deep Drop" />
    <meta property="og:description" content="A daily number-estimation game where you set a mattress range over a canyon to catch the jumper." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Full-Screen Atmospheric Tint Overlay (Sunset warm tint / Night dark tint) -->
    <div class="fullscreen-tint-overlay" aria-hidden="true"></div>

    <!-- Milestone 4 Item 8: Loading Screen -->
    <div id="app-loading-screen" class="app-fullscreen-screen" aria-live="polite">
      <div class="app-screen-card">
        <div class="brand-title brand-title-small">
          <span>TOLERATE</span>
          <span class="brand-dot" aria-hidden="true"></span>
          <span>THE DEEP DROP</span>
        </div>
        <div class="loading-spinner" aria-hidden="true"></div>
        <h2 id="loading-screen-text" class="screen-heading">Loading today's questions...</h2>
      </div>
    </div>

    <!-- Milestone 4 Item 4: Friendly Empty / Fallback Screen -->
    <div id="app-empty-screen" class="app-fullscreen-screen hidden" aria-live="polite">
      <div class="app-screen-card">
        <div class="brand-title brand-title-small">
          <span>TOLERATE</span>
          <span class="brand-dot" aria-hidden="true"></span>
          <span>THE DEEP DROP</span>
        </div>
        <div class="screen-icon" aria-hidden="true">🌉</div>
        <h2 id="empty-screen-text" class="screen-heading">No questions today. Check back soon!</h2>
        <button id="btn-empty-retry" type="button" class="btn-lock" style="margin-top: 18px; width: auto; padding: 10px 24px;">Retry</button>
      </div>
    </div>

    <!-- Main Game Viewport -->
    <main id="game-main-viewport" class="game-viewport">
      <!-- Top-Left Floating Test Panel: Hidden unless CONFIG.TEST_MODE === true (Item 7) -->
      <aside id="corner-test-panel" class="corner-test-panel hidden" aria-label="Developer Preview Controls">
        <button id="corner-test-toggle" type="button" class="corner-toggle-btn" title="Toggle Skies, Palettes and Test Answer">
          <span>⚙️ Theme</span>
        </button>

        <div id="corner-popup-content" class="corner-popup-content hidden">
          <div>
            <div class="test-section-title">Test True Answer:</div>
            <div class="test-input-row">
              <input id="test-true-answer-input" type="number" class="test-num-input" placeholder="Custom answer" />
              <button id="btn-set-custom-answer" type="button" class="test-pill-btn">Set</button>
            </div>
            <div class="test-btn-group" style="margin-top: 5px;">
              <button id="btn-test-hit" type="button" class="test-pill-btn" title="Set answer inside current range">Force Hit</button>
              <button id="btn-test-miss" type="button" class="test-pill-btn" title="Set answer outside current range">Force Miss</button>
              <button id="btn-replay" type="button" class="test-pill-btn" title="Replay current question">Replay</button>
            </div>
          </div>

          <div>
            <div class="test-section-title">Sky Slots:</div>
            <div class="test-btn-group">
              <button type="button" class="test-pill-btn sky-pill-btn active" data-slot="1">
                <span class="sky-dot day"></span> Day (Slot 1)
              </button>
              <button type="button" class="test-pill-btn sky-pill-btn" data-slot="2">
                <span class="sky-dot sunset"></span> Sunset (Slot 2)
              </button>
              <button type="button" class="test-pill-btn sky-pill-btn" data-slot="3">
                <span class="sky-dot night"></span> Night (Slot 3)
              </button>
            </div>
          </div>

          <div>
            <div class="test-section-title">Palette:</div>
            <div class="test-btn-group">
              <button type="button" class="test-pill-btn palette-pill-btn active" data-palette="golden">
                Golden
              </button>
              <button type="button" class="test-pill-btn palette-pill-btn" data-palette="meadow">
                Meadow
              </button>
              <button type="button" class="test-pill-btn palette-pill-btn" data-palette="mint">
                Mint
              </button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Top Card: Brand Title & Question (Exactly 3 Lines) -->
      <header class="floating-card-top" aria-label="Question Details">
        <div class="brand-title">
          <span>TOLERATE</span>
          <span class="brand-dot" aria-hidden="true"></span>
          <span id="puzzle-date-display">10/17/26</span>
        </div>
        <div id="question-progress-meta" class="question-meta">Question 1/3</div>
        <h1 id="question-text-display" class="question-text">Loading question...</h1>
      </header>

      <!-- Middle Canyon Playable Scene -->
      <div id="scene-svg-wrapper" class="scene-canvas-wrapper" aria-label="Canyon Play Area">
        <!-- SVG rendered dynamically by game.js -->
      </div>

      <!-- Bottom Card: Controls, Range Selection, and Result -->
      <section class="floating-card-bottom" aria-label="Controls and Range Selection">
        <!-- Calibrating View -->
        <div id="card-calibrating-view" class="card-view">
          <div class="readout-panel">
            <div class="range-display">
              <div class="range-label-row">
                <span class="range-label">Chosen Range</span>
              </div>
              <span id="range-value-display" class="range-value">0 – 0</span>
            </div>
            <div class="multiplier-tag">
              <span class="multiplier-label">Multiplier</span>
              <span id="multiplier-value-display" class="multiplier-badge-text">1.0x</span>
            </div>
          </div>

          <button id="btn-lock-in" type="button" class="btn-lock" aria-label="Lock in your chosen range">
            Lock it in
          </button>
        </div>

        <!-- Result View (Revealed after drop) -->
        <div id="card-result-view" class="card-view hidden" aria-live="polite">
          <div class="result-header-row">
            <span id="result-status-badge" class="result-badge hit">HIT</span>
            <span id="result-points-display" class="result-points-value">+0 pts</span>
          </div>
          <div class="result-details-row">
            <div class="result-detail-item">
              <span class="result-detail-label">True Answer</span>
              <span id="result-answer-display" class="result-detail-val">—</span>
            </div>
            <div class="result-detail-item">
              <span class="result-detail-label">Your Range</span>
              <span id="result-range-display" class="result-detail-val">—</span>
            </div>
            <div class="result-detail-item">
              <span class="result-detail-label">Multiplier</span>
              <span id="result-multiplier-display" class="result-detail-val">—</span>
            </div>
          </div>
          <button id="btn-next-question" type="button" class="btn-lock btn-next" aria-label="Proceed to next question">
            Next question
          </button>
        </div>
      </section>
    </main>

    <!-- Pinned Supabase JS CDN Library (exact pinned version 2.45.4) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

    <!-- Scripts -->
    <script src="./config.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
