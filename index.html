<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Tolerate: The Deep Drop</title>
    <meta name="description" content="Daily number-estimation game where you set a mattress range over a canyon to catch the jumper." />
    <meta property="og:title" content="Tolerate: The Deep Drop" />
    <meta property="og:description" content="Daily number-estimation game where you set a mattress range over a canyon to catch the jumper." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Full-Screen Atmospheric Tint Overlay (Sunset warm tint / Night dark tint) -->
    <div class="fullscreen-tint-overlay" aria-hidden="true"></div>

    <main class="game-viewport">
      <!-- Top Card: Brand Title & Question -->
      <header class="floating-card-top" aria-label="Question Details">
        <div class="brand-title">
          <span>TOLERATE</span>
          <span class="brand-dot" aria-hidden="true"></span>
          <span>THE DEEP DROP</span>
        </div>
        <div class="question-meta">Daily Question · Slot <span id="current-slot-num">1</span></div>
        <h1 id="question-text-display" class="question-text">How tall is the Eiffel Tower, in feet?</h1>
      </header>

      <!-- Middle Canyon Playable Scene -->
      <div id="scene-svg-wrapper" class="scene-canvas-wrapper" aria-label="Canyon Play Area">
        <!-- SVG rendered dynamically by game.js -->
      </div>

      <!-- Bottom Card: Range Readout, Multiplier, and Lock Button -->
      <section class="floating-card-bottom" aria-label="Controls and Range Selection">
        <div class="readout-panel">
          <div class="range-display">
            <span class="range-label">Chosen Range</span>
            <span id="range-value-display" class="range-value">600 – 1,400 ft</span>
          </div>
          <div class="multiplier-tag">
            <span class="multiplier-label">Multiplier</span>
            <span id="multiplier-value-display" class="multiplier-badge-text">2.5x</span>
          </div>
        </div>

        <button id="btn-lock-in" type="button" class="btn-lock">
          Lock it in
        </button>
      </section>

      <!-- Floating Test Panel: Anchored in Bottom-Left Corner away from cards -->
      <aside class="corner-test-panel" aria-label="Developer Preview Controls">
        <div id="corner-popup-content" class="corner-popup-content hidden">
          <div>
            <div class="test-section-title">Sky Slots:</div>
            <div class="test-btn-group">
              <button type="button" class="test-pill-btn sky-pill-btn active" data-slot="1">
                <span class="sky-dot day"></span> Day
              </button>
              <button type="button" class="test-pill-btn sky-pill-btn" data-slot="2">
                <span class="sky-dot sunset"></span> Sunset
              </button>
              <button type="button" class="test-pill-btn sky-pill-btn" data-slot="3">
                <span class="sky-dot night"></span> Night
              </button>
            </div>
          </div>

          <div>
            <div class="test-section-title">Palette:</div>
            <div class="test-btn-group">
              <button type="button" class="test-pill-btn palette-pill-btn active" data-palette="golden">
                Golden
              </button>
              <button type="button" class="test-pill-btn palette-pill-btn" data-palette="meadow">
                Meadow
              </button>
              <button type="button" class="test-pill-btn palette-pill-btn" data-palette="mint">
                Mint
              </button>
            </div>
          </div>
        </div>

        <button id="corner-test-toggle" type="button" class="corner-toggle-btn" title="Toggle Skies and Palettes">
          <span>⚙️ Theme</span>
        </button>
      </aside>
    </main>

    <!-- Scripts -->
    <script src="./config.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
